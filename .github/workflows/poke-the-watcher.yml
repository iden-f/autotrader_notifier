# This repository is retired. Its scheduler is not.
#
# The bot moved to iden-f/autotrader_minimal_secrets, and the one thing left
# here worth having is a second, independent place GitHub might fire a cron.
# Measured on the new repo, roughly one scheduled firing in eight is served;
# two repositories asking is two draws rather than one, and their drops are
# not correlated in any way either of them controls.
#
# All this does is ask the watcher to run. It scrapes nothing, stores nothing
# and sends nothing.
#
# IT NEEDS ONE SECRET. A workflow's own GITHUB_TOKEN is scoped to the
# repository it runs in and cannot reach another one, so this needs a
# fine-grained personal access token:
#
#   1. github.com/settings/personal-access-tokens/new
#   2. Repository access: only iden-f/autotrader_minimal_secrets
#   3. Permissions → Repository → Contents: Read and write
#   4. Save it here as the secret WATCHER_DISPATCH_TOKEN
#
# Without it every run stops on the first step and says so, rather than
# failing quietly and looking like a scheduler that works.

name: Poke the watcher

on:
  schedule:
    # Off the contended minutes, and off the three the watcher's own
    # pacemakers use, so a served firing here is genuinely another chance.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: poke-the-watcher
  cancel-in-progress: true

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the watcher to check
        env:
          TOKEN: ${{ secrets.WATCHER_DISPATCH_TOKEN }}
        run: |
          set -u
          if [ -z "${TOKEN:-}" ]; then
            {
              echo "## Not configured"
              echo "WATCHER_DISPATCH_TOKEN is not set, so this cannot reach"
              echo "iden-f/autotrader_minimal_secrets. See the comment at the"
              echo "top of .github/workflows/poke-the-watcher.yml for the four"
              echo "steps that fix it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no WATCHER_DISPATCH_TOKEN; nothing was asked to run"
            exit 1
          fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/iden-f/autotrader_minimal_secrets/dispatches \
            -d '{"event_type":"check","client_payload":{"from":"autotrader_notifier"}}')
          echo "HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::error::dispatch refused: HTTP $code $(head -c 300 /tmp/out)"
            exit 1
          fi
          echo "Asked the watcher to check." >> "$GITHUB_STEP_SUMMARY"
